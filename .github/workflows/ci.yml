name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FIREBASE_CLI_UPDATE_NOTIFIER: "false"

jobs:
  node:
    name: Node services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke:local
      - run: npm run smoke:production

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:functions
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npx firebase emulators:exec --only functions "npm run test:functions:emulator" --project horen-check-rules-test

  firestore-rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npx firebase emulators:exec --only firestore "npm run test:rules" --project horen-check-rules-test

  flutter:
    name: Flutter web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
